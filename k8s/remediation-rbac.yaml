apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-sa
  namespace: self-healing

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: remediation-role
  namespace: self-healing
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remediation-rolebinding
  namespace: self-healing
subjects:
  - kind: ServiceAccount
    name: remediation-sa
    namespace: self-healing
roleRef:
  kind: Role
  name: remediation-role
  apiGroup: rbac.authorization.k8s.io
